[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "orpheus-nx"
version = "0.1.0"
description = "Probabilistic graph intelligence and anomaly detection for critical infrastructure telemetry"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "Kristian"}]
dependencies = [
  "numpy>=2.0",
  "pandas>=2.2",
  "scipy>=1.12",
  "scikit-learn>=1.5",
  "networkx>=3.3",
  "fastapi>=0.115",
  "uvicorn>=0.30",
  "pydantic>=2.8",
  "typer>=0.12",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27"]

[project.scripts]
orpheus = "orpheus_nx.cli:app"
orpheus-api = "orpheus_nx.api:run"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"
